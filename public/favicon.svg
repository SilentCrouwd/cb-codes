<!-- Favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Weicher Schlagschatten für den originalen Look -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <!-- Haupt-Schriftart Einbindung (Fallback: Schreibschrift) -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Poppins:wght@400;600&amp;display=swap');
      .script-text {
        font-family: 'Caveat', 'Brush Script MT', cursive;
        font-weight: 700;
        font-size: 110px;
        fill: #ffffff;
        stroke: #1a1a1a;
        stroke-width: 3px;
        paint-order: stroke fill;
      }
      .sub-text {
        font-family: 'Poppins', sans-serif;
        font-weight: 400;
        font-size: 38px;
        fill: #ffffff;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <!-- Dunkler Hintergrund-Kreis, damit das weiße Favicon auf hellem Browser-Tab perfekt sichtbar ist -->
  <circle cx="250" cy="250" r="230" fill="#121212" />

  <!-- Logo Gruppe mit Rotation und Schatten -->
  <g filter="url(#drop-shadow)" transform="translate(250, 230) rotate(-12) translate(-250, -230)">
    
    <!-- cb.codes Text -->
    <text x="250" y="210" text-anchor="middle" class="script-text">cb.codes</text>
    
    <!-- Dynamischer Schwung (Underline Path) -->
    <path d="M 80 230 Q 250 280 430 180 Q 250 250 80 230 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    
    <!-- design Text -->
    <text x="250" y="295" text-anchor="middle" class="sub-text">design</text>
    
  </g>
</svg>
